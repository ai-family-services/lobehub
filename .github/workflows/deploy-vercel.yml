# ==============================================================================
# 10 MODULE DOCSTRING & USAGE INSTRUCTIONS
# ==============================================================================
# Name: Ultimate Sandbox-Bypass Vercel Deployment Pipeline (JSON Safe)
# Description: 
#   Vercel isoliert den Build-Prozess und ignoriert OS-Variablen. 
#   Dieses Skript bricht in die Sandbox ein, schreibt Dummy-Datenbank-Werte 
#   direkt in die .env Datei. Danach nutzt es ein sicheres Node.js Skript, 
#   um den 'db:migrate' Befehl restlos aus der package.json zu entfernen, 
#   ohne die JSON-Syntax zu zerstören.
# ==============================================================================

name: Manuelles Vercel Deployment

on:
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  Deploy:
    runs-on: ubuntu-latest
    
    steps:
      # --- Schritt 1: Quellcode laden ---
      - name: 1. Code aus dem Repository laden (Checkout)
        uses: actions/checkout@v4

      # --- Schritt 2: Node Engine ---
      - name: 2. Node.js Laufzeitumgebung einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Schritt 3: Bun Paketmanager ---
      - name: 3. Bun Laufzeitumgebung einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --- Schritt 4: Vercel Tooling ---
      - name: 4. Offizielles Vercel CLI installieren
        run: npm install --global vercel@latest

      # --- Schritt 5: SANDBOX BYPASS & JSON SAFE PATCH ---
      - name: 5. Vercel Umgebung & Build-Bypass injizieren
        run: |
          # 1. Echte Keys laden
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel env pull .env --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          
          # 2. Fake-DB-Variablen sicher in die .env Datei anhängen
          echo "" >> .env
          echo "NEXT_PUBLIC_SERVICE_MODE=client" >> .env
          echo "NEXT_PUBLIC_CLIENT_DB=pglite" >> .env
          echo "KEY_VAULTS_SECRET=u9B5xM2vQ8wR1tY3uI5oA0kF7jH4nC9lD2gS1bZ7X6e=" >> .env
          echo "DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy" >> .env
          
          # 3. JSON SAFE HACK: package.json sicher bearbeiten ohne Anführungszeichen zu zerstören
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (let key in pkg.scripts) {
              if (typeof pkg.scripts[key] === 'string') {
                // Sucht und löscht den Migrations-Befehl sicher aus allen Scripts
                pkg.scripts[key] = pkg.scripts[key].replace(/ && bun run db:migrate/g, '');
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('✅ db:migrate erfolgreich entfernt und JSON ist valide!');
          "

      # --- Schritt 6: Kompilieren ---
      - name: 6. Applikation kompilieren (Build)
        # Die JSON ist nun garantiert valide und die Fake-DB befriedigt Next.js
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # --- Schritt 7: Deployment ---
      - name: 7. Fertiges Paket an Vercel senden (Deploy)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
