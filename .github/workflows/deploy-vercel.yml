# ==============================================================================
# v11 MODULE DOCSTRING & USAGE INSTRUCTIONS
# ==============================================================================
# Name: Ultimate Sandbox-Bypass Vercel Deployment Pipeline (TGZ Archive)
# Description: 
#   Successfully bypasses Next.js database validations via OS environment injection
#   and safe package.json modification. 
#   Finally, compresses the massive >18k files LobeChat build into a single 
#   .tgz archive to bypass Vercel's strict 15k file upload limit on Hobby plans.
# ==============================================================================

name: Manuelles Vercel Deployment

on:
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  Deploy:
    runs-on: ubuntu-latest
    
    steps:
      # --- Schritt 1: Quellcode laden ---
      - name: 1. Code aus dem Repository laden (Checkout)
        uses: actions/checkout@v4

      # --- Schritt 2: Node Engine ---
      - name: 2. Node.js Laufzeitumgebung einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Schritt 3: Bun Paketmanager ---
      - name: 3. Bun Laufzeitumgebung einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --- Schritt 4: Vercel Tooling ---
      - name: 4. Offizielles Vercel CLI installieren
        run: npm install --global vercel@latest

      # --- Schritt 5: SANDBOX BYPASS & JSON SAFE PATCH ---
      - name: 5. Vercel Umgebung & Build-Bypass injizieren
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel env pull .env --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          
          # Fake-DB-Variablen sicher in die .env Datei anhängen
          echo "" >> .env
          echo "NEXT_PUBLIC_SERVICE_MODE=client" >> .env
          echo "NEXT_PUBLIC_CLIENT_DB=pglite" >> .env
          echo "KEY_VAULTS_SECRET=u9B5xM2vQ8wR1tY3uI5oA0kF7jH4nC9lD2gS1bZ7X6e=" >> .env
          echo "DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy" >> .env
          
          # JSON SAFE HACK: package.json sicher bearbeiten
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (let key in pkg.scripts) {
              if (typeof pkg.scripts[key] === 'string') {
                pkg.scripts[key] = pkg.scripts[key].replace(/ && bun run db:migrate/g, '');
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('✅ db:migrate erfolgreich entfernt!');
          "

      # --- Schritt 6: Kompilieren (läuft nun erfolgreich durch!) ---
      - name: 6. Applikation kompilieren (Build)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # --- Schritt 7: Deployment (Der TGZ Archiv Fix) ---
      - name: 7. Fertiges Paket an Vercel senden (Deploy)
        # NEU: Das Flag '--archive=tgz' komprimiert alle 18.281 Dateien in 
        # eine einzige Archivdatei und umgeht damit das Vercel Upload-Limit!
        run: vercel deploy --prebuilt --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }}
