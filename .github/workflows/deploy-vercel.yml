# ==============================================================================
# v07 MODULE DOCSTRING & USAGE INSTRUCTIONS
# ==============================================================================
# Name: Clean Manual Vercel Deployment Pipeline
# Description: 
#   Compiles LobeChat natively on GitHub Actions leveraging the default 16GB RAM.
#   Injects required secrets via OS-level environment variables to satisfy 
#   Next.js strict build-time validations.
# ==============================================================================

name: Manuelles Vercel Deployment

on:
  workflow_dispatch:

# ------------------------------------------------------------------------------
# GLOBALE UMGEBUNGSVARIABLEN (OS-Level Injection)
# Zieht die Keys sicher aus deinen Repository-Secrets direkt in den Build
# ------------------------------------------------------------------------------
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  KEY_VAULTS_SECRET: ${{ secrets.KEY_VAULTS_SECRET }}
  ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
  # Unterdrückt die gelbe "Node 20 actions are deprecated" Warnung
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  Deploy:
    runs-on: ubuntu-latest
    
    steps:
      # --- Schritt 1: Quellcode laden ---
      - name: 1. Code aus dem Repository laden (Checkout)
        uses: actions/checkout@v4

      # --- Schritt 2: Node Engine ---
      - name: 2. Node.js Laufzeitumgebung einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Schritt 3: Bun Paketmanager ---
      - name: 3. Bun Laufzeitumgebung einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --- Schritt 4: Vercel Tooling ---
      - name: 4. Offizielles Vercel CLI installieren
        run: npm install --global vercel@latest

      # --- Schritt 5: Projekt-Config Pull ---
      - name: 5. Vercel Projekt-Umgebung abrufen
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # --- Schritt 6: Kompilieren ---
      - name: 6. Applikation kompilieren (Build)
        # Next.js hat nun über 18GB kombinierten RAM zur Verfügung und die 
        # Secrets direkt im Betriebssystem!
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # --- Schritt 7: Deployment ---
      - name: 7. Fertiges Paket an Vercel senden (Deploy)
        # '--prebuilt' überspringt den Vercel-Builder komplett und pusht die App!
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
