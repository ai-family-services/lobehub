# ==============================================================================
# v16 MODULE DOCSTRING & USAGE INSTRUCTIONS
# ==============================================================================
# Name: LobeChat Sandbox-Breaker Deployment (The Nuke Option)
# Description: 
#   Vercel isoliert den Build-Prozess und liest AUSSCHLIESSLICH aus dem 
#   versteckten Ordner .vercel/.env.production.local. 
#   Dieses Skript bricht in diese Datei ein und hängt die Dummy-Variablen an.
#   Der Compiler kann nicht mehr ausweichen und MUSS fehlerfrei kompilieren.
# ==============================================================================

name: Manuelles Vercel Deployment

on:
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--no-deprecation"

jobs:
  Deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Code aus dem Repository laden (Checkout)
        uses: actions/checkout@v4

      - name: 2. Node.js Laufzeitumgebung einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Bun Paketmanager einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 4. Offizielles Vercel CLI installieren
        run: npm install --global vercel@latest

      - name: 5. SANDBOX BYPASS (Die Nuklear-Option)
        run: |
          # 1. Wir lassen Vercel seine versteckte Cache-Datei erstellen
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          
          # 2. DER ULTIMATIVE HACK: Wir schreiben die Dummys direkt in Vercels Hirn!
          # Alles zwischen 'EOF' wird physisch in die versteckte .vercel Datei gepresst.
          cat << 'EOF' >> .vercel/.env.production.local
          NEXT_PUBLIC_SERVICE_MODE=client
          NEXT_PUBLIC_CLIENT_DB=pglite
          KEY_VAULTS_SECRET=dummy_secret_for_build_bypass_32_bytes=
          DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
          BETTER_AUTH_SECRET=dummy_secret_for_build_bypass_32_bytes=
          QSTASH_TOKEN=dummy_qstash_token
          EOF
          
          # 3. JSON SAFE HACK: db:migrate sicher entfernen
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (let key in pkg.scripts) {
              if (typeof pkg.scripts[key] === 'string') {
                pkg.scripts[key] = pkg.scripts[key].replace(/ && bun run db:migrate/g, '');
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('✅ db:migrate erfolgreich entfernt!');
          "

      - name: 6. Applikation kompilieren (Build)
        # Next.js liest nun zwingend aus .vercel/.env.production.local
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 7. Fertiges Paket an Vercel senden (Deploy)
        run: vercel deploy --prebuilt --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }}
