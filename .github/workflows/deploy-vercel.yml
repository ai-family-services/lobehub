# ==============================================================================
# v02 ANLEITUNG / USAGE INSTRUCTIONS (Bitte vor der Nutzung lesen!)
# ==============================================================================
# Was macht dieses Skript?
# Da der kostenlose Vercel-Server (Hobby-Plan) beim Kompilieren von riesigen 
# Projekten wie LobeChat oft wegen zu wenig Arbeitsspeicher (RAM) abstürzt 
# (Fehler 137 / SIGKILL), verlagern wir die Schwerstarbeit mit diesem Skript 
# auf die kostenfreien, starken Server von GitHub (GitHub Actions).
#
# Voraussetzungen (Secrets):
# Unter Settings -> Secrets and variables -> Actions müssen 3 Secrets liegen:
# 1. VERCEL_TOKEN (Dein Vercel Account Token)
# 2. VERCEL_ORG_ID (Deine Vercel Account ID / Team ID)
# 3. VERCEL_PROJECT_ID (Deine Vercel Project ID)
#
# Wie startet man es?
# Reiter "Actions" -> Links auf "Manuelles Vercel Deployment" -> "Run workflow"
# ==============================================================================

# Der Name des Workflows im GitHub Actions Dashboard
name: Manuelles Vercel Deployment

# Trigger: Bestimmt, wann dieser Workflow startet
on:
  # Erzeugt den Button "Run workflow" für manuelle Ausführung
  workflow_dispatch:

# Globale Umgebungsvariablen für das Vercel CLI
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  Deploy:
    # Wir nutzen das aktuellste Ubuntu-Linux als Server-Betriebssystem
    runs-on: ubuntu-latest
    
    steps:
      # --- Schritt 1: Code laden ---
      - name: 1. Code aus dem Repository laden (Checkout)
        uses: actions/checkout@v4

      # --- Schritt 2: Node.js Umgebung ---
      - name: 2. Node.js Laufzeitumgebung einrichten
        uses: actions/setup-node@v4
        with:
          # Wir nutzen Version 20 (zuverlässigste LTS-Version für Next.js Builds)
          node-version: 20

      # --- Schritt 3: Bun Umgebung (DER FIX FÜR FEHLER 127) ---
      - name: 3. Bun Laufzeitumgebung einrichten
        # LobeChat nutzt neuere Build-Skripte, die den Paketmanager 'Bun' zwingend 
        # erfordern. Diese Action installiert Bun systemweit auf dem GitHub-Server.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --- Schritt 4: Vercel Tools ---
      - name: 4. Offizielles Vercel CLI installieren
        # Installiert das Kommandozeilen-Tool von Vercel, um mit der Vercel-API zu sprechen
        run: npm install --global vercel@latest

      # --- Schritt 5: Konfiguration holen ---
      - name: 5. Vercel Projekt-Umgebung abrufen (Pull)
        # Zieht deine Live-Einstellungen (wie z.B. deine hinterlegten API Keys) von Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # --- Schritt 6: Das Kompilieren ---
      - name: 6. Applikation kompilieren (Build)
        # Baut die App. Durch den Bun-Fix (Schritt 3) läuft dieser Schritt nun fehlerfrei durch.
        # Dies ist der rechenintensivste Prozess, der auf Vercel immer abgestürzt ist.
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # --- Schritt 7: Live-Schaltung ---
      - name: 7. Fertiges Paket an Vercel senden (Deploy)
        # Lädt nur noch das fertig gebaute, stark komprimierte Endprodukt hoch.
        # Das Flag '--prebuilt' schützt Vercel davor, selbst kompilieren zu wollen.
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
