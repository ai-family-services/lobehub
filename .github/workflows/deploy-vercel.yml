# ==============================================================================
# v03 ANLEITUNG / USAGE INSTRUCTIONS 
# ==============================================================================
# Vercel Deployment-Skript für große Monorepos (inklusive Env-Extraktion)
# ==============================================================================

# Der Name des Workflows im GitHub Actions Dashboard
name: Manuelles Vercel Deployment

# Trigger: Erzeugt den manuellen Start-Button in der GitHub-Oberfläche
on:
  workflow_dispatch:

# Globale Umgebungsvariablen für das Vercel CLI (kommen aus den GitHub Secrets)
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  Deploy:
    # Wir nutzen das aktuellste Ubuntu-Linux als Wegwerf-Server
    runs-on: ubuntu-latest
    
    steps:
      # --- Schritt 1: Code laden ---
      - name: 1. Code aus dem Repository laden (Checkout)
        uses: actions/checkout@v4

      # --- Schritt 2: Node.js Umgebung ---
      - name: 2. Node.js Laufzeitumgebung einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Schritt 3: Bun Umgebung ---
      - name: 3. Bun Laufzeitumgebung einrichten
        # LobeChat benötigt Bun zum Bauen. Wir installieren es auf dem Server.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --- Schritt 4: Vercel Tools ---
      - name: 4. Offizielles Vercel CLI installieren
        # Installiert das Vercel-Kommandozeilen-Tool
        run: npm install --global vercel@latest

      # --- Schritt 5: Konfiguration & Secrets holen ---
      - name: 5. Vercel Projekt-Umgebung & Secrets abrufen
        # 'pull' lädt die Projektstruktur.
        # 'env pull .env' zieht deine Keys (Google, Access_Code, Key_Vaults_Secret) 
        # aus Vercel und speichert sie TEMPORÄR als .env auf diesem Server, 
        # damit der Build-Prozess sie im nächsten Schritt findet.
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel env pull .env --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # --- Schritt 6: Das Kompilieren ---
      - name: 6. Applikation kompilieren (Build)
        # Baut die App. Er greift jetzt auf die lokale .env zu und stürzt nicht mehr ab.
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # --- Schritt 7: Live-Schaltung ---
      - name: 7. Fertiges Paket an Vercel senden (Deploy)
        # Lädt nur das fertige, vorkompilierte Endprodukt hoch.
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # --- Schritt 8: Security Cleanup ---
      - name: 8. Sicherheit: Temporäre Keys restlos löschen (Cleanup)
        # BEST PRACTICE: Wir löschen die .env Datei sofort nach dem Hochladen hart
        # vom Server, damit keine Secrets auf dem Runner zurückbleiben.
        run: rm -f .env
