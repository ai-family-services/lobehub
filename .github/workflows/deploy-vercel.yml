# ==============================================================================
# v14 add .env again - MODULE DOCSTRING & USAGE INSTRUCTIONS
# ==============================================================================
# Name: LobeChat Client-Mode Deployment (The Golden Master)
# Description: 
#   Erstellt eine lokale .env Datei mit Dummy-Werten, um den Next.js Compiler 
#   auf GitHub zu befriedigen. Entfernt sicher das db:migrate Skript.
#   Pusht das fertige Paket per .tgz Archiv zu Vercel.
# ==============================================================================

name: Manuelles Vercel Deployment

on:
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--no-deprecation"

jobs:
  Deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Code aus dem Repository laden (Checkout)
        uses: actions/checkout@v4

      - name: 2. Node.js Laufzeitumgebung einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Bun Paketmanager einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 4. Offizielles Vercel CLI installieren
        run: npm install --global vercel@latest

      - name: 5. Build-Bypass injizieren (.env Erstellung)
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          
          # Wir erstellen die .env Datei lokal, damit der Compiler nicht abstürzt
          echo "NEXT_PUBLIC_SERVICE_MODE=client" > .env
          echo "NEXT_PUBLIC_CLIENT_DB=pglite" >> .env
          echo "KEY_VAULTS_SECRET=dummy_secret_for_build_bypass_32_bytes=" >> .env
          echo "DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy" >> .env
          echo "BETTER_AUTH_SECRET=dummy_secret_for_build_bypass_32_bytes=" >> .env
          echo "QSTASH_TOKEN=dummy_qstash_token_for_build" >> .env
          
          # Sicheres Entfernen von db:migrate
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (let key in pkg.scripts) {
              if (typeof pkg.scripts[key] === 'string') {
                pkg.scripts[key] = pkg.scripts[key].replace(/ && bun run db:migrate/g, '');
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('✅ db:migrate erfolgreich entfernt!');
          "

      - name: 6. Applikation kompilieren (Build)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 7. Fertiges Paket an Vercel senden (Deploy)
        run: vercel deploy --prebuilt --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }}
