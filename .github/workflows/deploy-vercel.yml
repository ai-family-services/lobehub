# ==============================================================================
# v09 MODULE DOCSTRING & USAGE INSTRUCTIONS
# ==============================================================================
# Name: Ultimate Sandbox-Bypass Vercel Deployment Pipeline
# Description: 
#   Vercel isoliert den Build-Prozess und ignoriert OS-Variablen. 
#   Dieses Skript bricht in die Sandbox ein, schreibt Dummy-Datenbank-Werte 
#   direkt in die .env Datei und löscht hart den db:migrate Befehl.
#   So wird Next.js ausgetrickst und kompiliert den Chat für den Client-Modus.
# ==============================================================================

name: Manuelles Vercel Deployment

on:
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # Unterdrückt die GitHub-Warnungen
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  Deploy:
    runs-on: ubuntu-latest
    
    steps:
      # --- Schritt 1: Quellcode laden ---
      - name: 1. Code aus dem Repository laden (Checkout)
        uses: actions/checkout@v4

      # --- Schritt 2: Node Engine ---
      - name: 2. Node.js Laufzeitumgebung einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Schritt 3: Bun Paketmanager ---
      - name: 3. Bun Laufzeitumgebung einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --- Schritt 4: Vercel Tooling ---
      - name: 4. Offizielles Vercel CLI installieren
        run: npm install --global vercel@latest

      # --- Schritt 5: SANDBOX BYPASS (Hier passiert die Magie) ---
      - name: 5. Vercel Umgebung & Build-Bypass injizieren
        run: |
          # 1. Wir laden deine echten Keys (Google API, Access Code)
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel env pull .env --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          
          # 2. DER HACK: Wir schreiben die Fake-DB-Variablen physisch in die .env Datei!
          # Dadurch MUSS der Compiler sie einlesen und stürzt bei der Prüfung nicht ab.
          echo "" >> .env
          echo "NEXT_PUBLIC_SERVICE_MODE=client" >> .env
          echo "NEXT_PUBLIC_CLIENT_DB=pglite" >> .env
          echo "KEY_VAULTS_SECRET=u9B5xM2vQ8wR1tY3uI5oA0kF7jH4nC9lD2gS1bZ7X6e=" >> .env
          echo "DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy" >> .env
          
          # 3. Wir schneiden mit 'sed' das db:migrate Skript hart aus dem Code heraus.
          sed -i 's/bun run db:migrate/echo "Skip DB"/g' package.json

      # --- Schritt 6: Kompilieren ---
      - name: 6. Applikation kompilieren (Build)
        # Next.js liest nun die modifizierte .env und ist wunschlos glücklich!
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # --- Schritt 7: Deployment ---
      - name: 7. Fertiges Paket an Vercel senden (Deploy)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
