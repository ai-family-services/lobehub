# ==============================================================================
# MODULE DOCSTRING & USAGE INSTRUCTIONS
# ==============================================================================
# Name: OOM-Proof Manual Vercel Deployment Pipeline
# Description: 
#   This advanced CI/CD script offloads the heavy Next.js/Bun build process 
#   from Vercel to GitHub Actions. To prevent Out-Of-Memory (OOM) kills on 
#   standard 7GB GitHub runners during the massive LobeChat compilation, 
#   it injects an 8GB SSD Swap-File. It also forces Node 24 runtime to 
#   prevent deprecation warnings and securely handles `.env` variables.
#
# Usage:
#   1. Commit this file to `.github/workflows/deploy-vercel.yml`.
#   2. Go to 'Actions' tab -> 'Manuelles Vercel Deployment' -> 'Run workflow'.
# ==============================================================================

name: Manuelles Vercel Deployment

on:
  workflow_dispatch:

env:
  # Vercel API Keys
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # State-of-the-Art (2026): Unterdrückt Deprecation-Warnungen und nutzt V8 Engine Upgrades
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  Deploy:
    runs-on: ubuntu-latest
    
    steps:
      # ------------------------------------------------------------------------
      # SCHRITT 1: Quellcode vorbereiten
      # ------------------------------------------------------------------------
      - name: 1. Code aus dem Repository laden (Checkout)
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # SCHRITT 2: Node.js Architektur bereitstellen
      # ------------------------------------------------------------------------
      - name: 2. Node.js Laufzeitumgebung einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ------------------------------------------------------------------------
      # SCHRITT 3: Bun Paketmanager installieren
      # ------------------------------------------------------------------------
      - name: 3. Bun Laufzeitumgebung einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ------------------------------------------------------------------------
      # SCHRITT 4: DEVOPS MEMORY HACK (Der Fix für deinen Fehler!)
      # ------------------------------------------------------------------------
      - name: 4. Server-RAM verdoppeln (8GB Swap File anlegen)
        # LobeChat fordert per Skript 8192 MB RAM. Der Server hat nur 7000 MB.
        # Wir erstellen hier auf der SSD des Servers 8 GB virtuellen Arbeitsspeicher.
        # 'fallocate' reserviert den Platz, 'mkswap' formatiert ihn, 'swapon' aktiviert ihn.
        run: |
          echo "Aktueller RAM vor dem Hack:"
          free -h
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Neuer RAM nach dem Hack (Swap wurde vergrößert):"
          free -h

      # ------------------------------------------------------------------------
      # SCHRITT 5: Vercel Tooling installieren
      # ------------------------------------------------------------------------
      - name: 5. Offizielles Vercel CLI installieren
        run: npm install --global vercel@latest

      # ------------------------------------------------------------------------
      # SCHRITT 6: Konfiguration und Sicherheits-Schlüssel holen
      # ------------------------------------------------------------------------
      - name: 6. Vercel Projekt-Umgebung und Secrets abrufen
        # Zieht die Keys (inkl. KEY_VAULTS_SECRET) unsichtbar auf den Runner
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel env pull .env --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # ------------------------------------------------------------------------
      # SCHRITT 7: Kompilieren (Jetzt mit genug Speicher!)
      # ------------------------------------------------------------------------
      - name: 7. Applikation kompilieren (Build)
        # Dank der Swap-File aus Schritt 4 wird der Linux OOM-Killer hier nicht
        # mehr eingreifen. Der Next.js Build läuft sicher durch.
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # ------------------------------------------------------------------------
      # SCHRITT 8: Live-Schaltung
      # ------------------------------------------------------------------------
      - name: 8. Fertiges Paket an Vercel senden (Deploy)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # ------------------------------------------------------------------------
      # SCHRITT 9: Security Cleanup
      # ------------------------------------------------------------------------
      - name: 9. Sicherheit - Temporaere Keys restlos loeschen
        run: rm -f .env
