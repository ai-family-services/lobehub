# ==============================================================================
# v06 MODULE DOCSTRING & USAGE INSTRUCTIONS
# ==============================================================================
# Name: OOM-Proof Manual Vercel Deployment Pipeline (Community Best-Practice)
# Description: 
#   Dieses CI/CD Skript löst das bekannte Vercel 1GB RAM-Limit Problem,
#   das bei Monorepos wie LobeChat zu 'Exit Code 137' führt. 
#   Wir nutzen stattdessen GitHub Actions (16GB RAM) + 8GB SSD-Swap.
#
# Architektur-Fixes inkludiert:
#   - dd-Swap Creation (verhindert 'fallocate' OverlayFS Fehler)
#   - OS-Level Secret Injection (verhindert Next.js Build-Time Fehler)
#   - Node 24 Fix (verhindert Deprecation Warnungen)
# ==============================================================================

name: Manuelles Vercel Deployment

on:
  workflow_dispatch:

# ------------------------------------------------------------------------------
# GLOBALE UMGEBUNGSVARIABLEN (OS-Level Injection)
# ------------------------------------------------------------------------------
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  KEY_VAULTS_SECRET: ${{ secrets.KEY_VAULTS_SECRET }}
  ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
  # Zwingt GitHub Actions auf die moderne V8 Engine (unterdrückt Warnungen)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  Deploy:
    runs-on: ubuntu-latest
    
    steps:
      # --- Schritt 1: Quellcode laden ---
      - name: 1. Code aus dem Repository laden (Checkout)
        uses: actions/checkout@v4

      # --- Schritt 2: Node Engine ---
      - name: 2. Node.js Laufzeitumgebung einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Schritt 3: Bun Paketmanager ---
      - name: 3. Bun Laufzeitumgebung einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --- Schritt 4: DevOps Memory Hack (Der dd-Fix) ---
      - name: 4. Server-RAM absichern (8GB Swap File anlegen)
        # Wir nutzen 'dd' statt 'fallocate', um den 'Text file busy' Fehler 
        # auf virtuellen Dateisystemen zu umgehen. 
        # bs=1M und count=8192 schreibt präzise 8 Gigabyte auf die SSD.
        run: |
          echo "Erstelle 8GB Swap mit dd (Dies dauert ca. 5-10 Sekunden)..."
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap erfolgreich gemountet!"
          free -h

      # --- Schritt 5: Vercel Tooling ---
      - name: 5. Offizielles Vercel CLI installieren
        run: npm install --global vercel@latest

      # --- Schritt 6: Projekt-Config Pull ---
      - name: 6. Vercel Projekt-Umgebung abrufen
        # Zieht die restliche Projektstruktur. Secrets liegen ohnehin im globalen 'env'.
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # --- Schritt 7: Kompilieren ---
      - name: 7. Applikation kompilieren (Build)
        # Next.js hat nun über 20GB kombinierten RAM zur Verfügung und die 
        # Secrets direkt im Betriebssystem!
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # --- Schritt 8: Deployment ---
      - name: 8. Fertiges Paket an Vercel senden (Deploy)
        # '--prebuilt' überspringt den Vercel-Builder komplett!
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
