# ==============================================================================
# v13 redo bypass, MODULE DOCSTRING & USAGE INSTRUCTIONS
# ==============================================================================
# Name: LobeChat Bulletproof OS-Level Vercel Deployment
# Description: 
#   The ultimate CI/CD pipeline. Injects required bypass variables directly 
#   into the runner's OS memory (env block) to guarantee Next.js reads them.
#   Safely removes the database migration script and bypasses Vercel file limits.
# ==============================================================================

name: Manuelles Vercel Deployment

on:
  workflow_dispatch:

# ------------------------------------------------------------------------------
# GLOBALE UMGEBUNGSVARIABLEN (OS-Level Injection)
# Diese Werte werden direkt in den RAM geladen. 100% resistent gegen Cache-Fehler.
# ------------------------------------------------------------------------------
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--no-deprecation"
  
  # --- DER BULLETPROOF BYPASS ---
  NEXT_PUBLIC_SERVICE_MODE: client
  NEXT_PUBLIC_CLIENT_DB: pglite
  KEY_VAULTS_SECRET: "u9B5xM2vQ8wR1tY3uI5oA0kF7jH4nC9lD2gS1bZ7X6e="
  DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
  BETTER_AUTH_SECRET: "u9B5xM2vQ8wR1tY3uI5oA0kF7jH4nC9lD2gS1bZ7X6e="
  QSTASH_TOKEN: "dummy_qstash_token"

jobs:
  Deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Code aus dem Repository laden (Checkout)
        uses: actions/checkout@v4

      - name: 2. Node.js Laufzeitumgebung einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Bun Paketmanager einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 4. Offizielles Vercel CLI installieren
        run: npm install --global vercel@latest

      - name: 5. Vercel Projekt-Umgebung abrufen
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 6. JSON SAFE HACK (db:migrate entfernen)
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (let key in pkg.scripts) {
              if (typeof pkg.scripts[key] === 'string') {
                pkg.scripts[key] = pkg.scripts[key].replace(/ && bun run db:migrate/g, '');
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('✅ db:migrate erfolgreich entfernt!');
          "

      - name: 7. Applikation kompilieren (Build)
        # Next.js liest KEY_VAULTS_SECRET jetzt garantiert aus dem OS RAM!
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 8. Fertiges Paket an Vercel senden (Deploy)
        run: vercel deploy --prebuilt --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }}
